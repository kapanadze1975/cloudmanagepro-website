<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CloudManagePro Articles | IT Guides, Labs & Troubleshooting</title>
  <meta name="description" content="Practical CloudManagePro guides, labs, tutorials, and troubleshooting for Intune, Azure, Entra ID, Microsoft 365, Workspace ONE, Citrix, networking, cybersecurity, healthcare IT, and automation." />
  <link rel="canonical" href="https://www.cloudmanagepro.com/articles/" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    :root{
      --cmp-navy:#061b38;
      --cmp-navy2:#082a55;
      --cmp-blue:#0f6bff;
      --cmp-teal:#19bfc1;
      --cmp-text:#14233b;
      --cmp-muted:#62748b;
      --cmp-line:#dfe7f1;
      --cmp-bg:#f7faff;
      --cmp-card:#ffffff;
      --cmp-shadow:0 12px 32px rgba(17,45,86,.08);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:#fff;color:var(--cmp-text);font-family:Inter,Segoe UI,Arial,sans-serif}
    a{text-decoration:none}
    .cmp-container{width:min(1180px,calc(100% - 36px));margin:auto}

    /* Header */
    .cmp-header{background:var(--cmp-navy);position:sticky;top:0;z-index:20;box-shadow:0 1px 0 rgba(255,255,255,.08)}
    .cmp-nav{height:72px;display:flex;align-items:center;justify-content:space-between;gap:24px}
    .cmp-brand{display:flex;align-items:center;gap:10px;color:#fff;font-size:1.35rem;font-weight:800;letter-spacing:-.02em}
    .cmp-brand img{width:39px;height:39px}
    .cmp-navlinks{display:flex;align-items:center;gap:27px}
    .cmp-navlinks a{color:#eef6ff;font-size:.96rem;font-weight:700}
    .cmp-navlinks a:hover{color:#78caff}
    .cmp-support{padding:11px 18px;border-radius:10px;background:var(--cmp-blue);color:#fff!important}
    .cmp-menu{display:none;background:none;border:0;color:#fff;font-size:1.6rem}

    /* Hero */
    .articles-hero{
      background:
        radial-gradient(circle at 81% 36%,rgba(77,155,255,.2),transparent 31%),
        linear-gradient(120deg,#fff 0%,#f6faff 57%,#eaf4ff 100%);
      border-bottom:1px solid #e7eff8;
      overflow:hidden;
    }
    .hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:30px;align-items:center;min-height:220px;padding:38px 0}
    .hero-copy h1{font-size:clamp(2.5rem,4.6vw,4.25rem);line-height:.98;letter-spacing:-.05em;margin:0 0 15px;color:#071a39}
    .hero-copy p{margin:0;color:#40536c;font-size:1.08rem;line-height:1.65;max-width:720px}
    .search-wrap{margin-top:24px;position:relative;max-width:620px}
    .search-icon{position:absolute;left:18px;top:50%;transform:translateY(-50%);font-size:1.2rem}
    #articleSearch{width:100%;height:50px;padding:0 18px 0 49px;border:1px solid #cad7e7;border-radius:10px;background:#fff;font:inherit;box-shadow:0 8px 24px rgba(16,50,95,.05)}
    #articleSearch:focus{outline:3px solid rgba(15,107,255,.14);border-color:var(--cmp-blue)}
    .hero-art{display:flex;justify-content:center;align-items:center;position:relative;min-height:170px}
    .hero-clouds{position:absolute;width:100%;height:100%;opacity:.85;background:
      radial-gradient(circle at 28% 53%,#cde4ff 0 12%,transparent 13%),
      radial-gradient(circle at 42% 42%,#dcecff 0 15%,transparent 16%),
      radial-gradient(circle at 58% 50%,#c7e1ff 0 13%,transparent 14%);
      filter:blur(.2px)}
    .hero-device{z-index:2;width:210px;height:122px;border-radius:12px;background:linear-gradient(160deg,#082a55,#0f6bff);padding:9px;box-shadow:0 25px 38px rgba(15,65,120,.2)}
    .hero-device-screen{height:100%;border-radius:7px;background:linear-gradient(160deg,#e7f4ff,#fff);display:grid;place-items:center}
    .hero-device-screen img{width:64px;height:64px}
    .hero-shield{position:absolute;z-index:3;top:8px;left:31%;width:70px;height:70px;border-radius:18px;display:grid;place-items:center;background:#fff;box-shadow:var(--cmp-shadow)}
    .hero-shield img{width:48px;height:48px}

    /* category row */
    .category-strip{background:#fff;border-bottom:1px solid #e9eef5}
    .category-scroll{display:flex;gap:10px;overflow-x:auto;padding:13px 0;scrollbar-width:none}
    .category-scroll::-webkit-scrollbar{display:none}
    .category-btn{white-space:nowrap;border:1px solid #d9e2ed;background:#fff;color:#213653;border-radius:9px;padding:10px 15px;font-weight:800;cursor:pointer}
    .category-btn.active,.category-btn:hover{background:#0b58cf;border-color:#0b58cf;color:#fff}

    /* layout */
    .hub{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:24px;padding:24px 0 45px}
    .main-column{min-width:0}
    .sidebar{display:flex;flex-direction:column;gap:15px}

    /* featured */
    .featured{position:relative;overflow:hidden;border-radius:13px;background:radial-gradient(circle at 83% 40%,rgba(20,186,196,.2),transparent 27%),linear-gradient(130deg,#061d3e 0%,#072d5e 65%,#0b4b91 120%);min-height:295px;color:#fff;padding:31px 33px;box-shadow:var(--cmp-shadow)}
    .featured:after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(69,175,255,.2) 1px,transparent 1px);background-size:16px 16px;mask-image:linear-gradient(90deg,transparent 35%,#000 100%);pointer-events:none}
    .featured-copy{position:relative;z-index:2;max-width:56%}
    .feature-top{display:flex;align-items:center;gap:12px;font-size:.73rem;font-weight:900;letter-spacing:.06em}
    .feature-label{background:#24c4b7;color:#073047;border-radius:5px;padding:5px 9px}
    .featured h2{font-size:clamp(1.8rem,3vw,2.6rem);line-height:1.07;letter-spacing:-.025em;margin:17px 0 12px;color:#fff}
    .featured p{color:#dcecff;line-height:1.55;margin:0 0 20px;font-size:.98rem}
    .feature-meta{display:flex;gap:14px;align-items:center;font-size:.84rem;color:#c9def5}
    .feature-cta{display:inline-block;margin-top:19px;background:#1478ff;color:#fff;padding:11px 20px;border-radius:8px;font-weight:900}
    .feature-visual{position:absolute;z-index:2;right:27px;top:37px;width:36%;height:210px;display:flex;align-items:center;justify-content:center}
    .feature-laptop{width:190px;height:116px;background:#0b2b55;border:5px solid #0d477e;border-radius:9px;padding:9px;box-shadow:0 18px 35px rgba(0,0,0,.26)}
    .feature-screen{height:100%;border-radius:4px;background:#eaf6ff;display:flex;align-items:center;justify-content:center;gap:9px;font-weight:900;color:#17314c}
    .check{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#24c4b7;color:#fff;font-size:1.5rem}
    .feature-cloud{position:absolute;right:0;top:0;width:142px;height:70px;border-radius:50px;background:#fff;color:#344b65;display:grid;place-items:center;font-weight:800;box-shadow:0 8px 23px rgba(0,0,0,.16)}
    .feature-lock{position:absolute;right:20px;bottom:-1px;width:66px;height:66px;border-radius:18px;background:linear-gradient(145deg,#0f6bff,#19bfc1);display:grid;place-items:center;font-size:2rem}

    /* cards */
    .article-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:15px}
    .article-card{border:1px solid #dfe7f1;background:#fff;border-radius:12px;padding:13px;display:grid;grid-template-columns:88px 1fr;gap:13px;min-height:155px;box-shadow:0 5px 18px rgba(17,45,86,.035)}
    .article-card[hidden]{display:none}
    .card-art{width:88px;height:88px;border-radius:10px;background:linear-gradient(145deg,#eaf5ff,#f7fbff);display:grid;place-items:center}
    .card-art img{width:58px;height:58px}
    .card-category{color:#0f6bff;font-size:.68rem;font-weight:900;text-transform:uppercase;letter-spacing:.04em}
    .article-card h3{font-size:.98rem;line-height:1.18;margin:5px 0 6px;color:#10233e}
    .article-card p{font-size:.78rem;line-height:1.35;margin:0;color:#52657b}
    .card-meta{grid-column:1 / -1;padding-top:8px;border-top:1px solid #edf1f6;font-size:.72rem;color:#75869a}
    .soon{color:#0f6bff;font-weight:800}

    /* sidebar */
    .side-card{border:1px solid #dfe7f1;border-radius:12px;background:#fff;padding:17px;box-shadow:0 5px 18px rgba(17,45,86,.035)}
    .side-title{font-size:1rem;font-weight:900;margin:0 0 13px;display:flex;align-items:center;gap:9px}
    .side-list{display:grid;gap:10px}
    .side-row{display:flex;align-items:flex-start;gap:10px;color:#304763;font-size:.82rem;line-height:1.25}
    .side-bullet{color:#0f6bff;font-weight:900;min-width:14px}
    .side-link{display:inline-block;margin-top:13px;color:#0f6bff;font-size:.8rem;font-weight:800}
    .mini-icon{width:32px;height:32px;border-radius:7px;background:#e9f4ff;display:grid;place-items:center;flex:0 0 auto}
    .mini-icon img{width:21px;height:21px}
    .pdf{color:#e74c3c;font-weight:900}

    /* topics */
    .browse{margin-top:18px}
    .browse h2{font-size:1.14rem;margin:0 0 11px}
    .topic-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:11px}
    .topic-card{border:1px solid #d8e4f2;border-radius:11px;background:#fff;padding:15px}
    .topic-card img{width:38px;height:38px;margin-bottom:8px}
    .topic-card h3{font-size:.91rem;margin:0 0 6px}
    .topic-card p{font-size:.72rem;line-height:1.38;color:#5f7186;margin:0 0 8px}
    .topic-card span{font-size:.72rem;color:#0f6bff;font-weight:900}

    .empty-state{display:none;padding:35px;text-align:center;border:1px dashed #bfd0e5;border-radius:12px;color:#60748d;margin-top:15px}

    /* footer */
    .cmp-footer{background:var(--cmp-navy);color:#dce7f5;padding:28px 0;margin-top:12px}
    .footer-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:25px;align-items:start}
    .cmp-footer a{color:#dce7f5}
    .cmp-footer p{font-size:.85rem;line-height:1.5;color:#b9cce1}

    @media(max-width:1050px){
      .hub{grid-template-columns:1fr}
      .sidebar{display:grid;grid-template-columns:repeat(3,1fr)}
      .article-grid{grid-template-columns:repeat(2,1fr)}
      .topic-grid{grid-template-columns:repeat(3,1fr)}
    }
    @media(max-width:760px){
      .cmp-navlinks{display:none}
      .cmp-menu{display:block}
      .hero-grid{grid-template-columns:1fr;min-height:auto}
      .hero-art{display:none}
      .featured-copy{max-width:100%}
      .feature-visual{display:none}
      .article-grid{grid-template-columns:1fr}
      .sidebar{grid-template-columns:1fr}
      .topic-grid{grid-template-columns:repeat(2,1fr)}
      .footer-grid{grid-template-columns:1fr}
    }
    @media(max-width:450px){
      .article-card{grid-template-columns:72px 1fr}
      .card-art{width:72px;height:72px}
      .topic-grid{grid-template-columns:1fr}
    }
  </style>
